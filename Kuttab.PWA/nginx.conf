server {
    listen 80;
    server_name ai-solutions.al-manar.de;

    # --- Main website ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Kuttab PWA under /kuttab/ ---
    location /kuttab/ {
        alias /usr/share/nginx/kuttab/;
        index index.html;
        try_files $uri $uri/ /kuttab/index.html;

        # Serve pre-compressed .gz files (created by dotnet publish)
        gzip_static on;

        # Proper MIME types for Blazor WASM
        types {
            application/wasm wasm;
            application/octet-stream dll pdb;
            application/json json;
            text/javascript js;
            text/css css;
            text/html html;
            image/png png;
            application/manifest+json webmanifest;
        }
    }

    # Enable dynamic gzip for non-precompressed files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm application/octet-stream;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 6;
}
